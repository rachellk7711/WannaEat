<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head><body style="margin:0;background:#f3f5f0">
<div id="root"></div>
<script type="module">
// 앱에 실린 미니사전 한 항목을 결과 화면의 설명 창 그대로 그려 본다. 서버 목록을 기다리지 않는다.  ?id=fructose
import React from 'react'
import { createRoot } from 'react-dom/client'
import '/src/index.css'
import '/src/App.css'
import snapshot from '/src/catalog.snapshot.json'
import { GlossarySheet } from '/src/components/Glossary.tsx'
const id = new URLSearchParams(location.search).get('id') ?? 'fructose'
const criterion = snapshot.catalog.groups.flatMap(g => g.subgroups).flatMap(s => s.criteria).find(c => c.id === id)
createRoot(document.querySelector('#root')).render(React.createElement('main', { className: 'app' }, React.createElement(GlossarySheet, { criterion, badge: '피해요', onClose: () => {} })))
setTimeout(() => { const s = document.querySelector('.glossary-sheet'), b = document.querySelector('.sheet-backdrop'); document.body.dataset.m = [innerWidth, document.documentElement.clientWidth, b.getBoundingClientRect().width, s.getBoundingClientRect().width, s.scrollWidth].join(',') }, 500)
</script></body></html>
