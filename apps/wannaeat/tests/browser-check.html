<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>WannaEat browser checks</title></head><body>
<pre id="report">RUNNING</pre><iframe id="app" style="width:390px;height:844px;border:0" title="테스트 앱"></iframe>
<script type="module">
import { loadCatalog } from '/src/lib/catalog-loader.ts'
import { imageForExtraction, rotateImage } from '/src/lib/extract.ts'
const report = document.querySelector('#report'), frame = document.querySelector('#app')
const results = []
const check = (name, condition) => { results.push({ name, pass: !!condition }); if (!condition) throw Error(name) }
const wait = async (condition) => { for (let n=0;n<160;n++) { if (condition()) return; await new Promise(r=>setTimeout(r,100)) } throw Error('Timed out') }
const doc = () => frame.contentDocument
const button = label => doc().querySelector(`button[aria-label="${label}"]`)
const textButton = text => [...doc().querySelectorAll('button')].find(b=>b.textContent.includes(text))
const setValue = (element, value) => Object.getOwnPropertyDescriptor(element.ownerDocument.defaultView[element instanceof element.ownerDocument.defaultView.HTMLTextAreaElement ? 'HTMLTextAreaElement' : 'HTMLInputElement'].prototype, 'value').set.call(element, value)
const render = async () => new Promise(r=>setTimeout(r,100))
if (new URLSearchParams(location.search).get('run') !== 'isolated') {
  report.textContent = '테스트 전용 새 브라우저 프로필에서 ?run=isolated로 실행하세요. 해당 origin의 저장 자료를 비우는 테스트입니다.'
} else try {
  localStorage.clear()
  const source = document.createElement('canvas')
  source.width = 2000; source.height = 1200
  const paint = source.getContext('2d')
  paint.fillStyle = '#fff'; paint.fillRect(0,0,2000,1200); paint.fillStyle = '#000'; paint.fillRect(200,120,1000,480)
  const prepared = await imageForExtraction(source.toDataURL('image/png'), { x:0.1, y:0.1, width:0.5, height:0.4 })
  check('only the chosen area is prepared as jpeg', prepared.mimeType === 'image/jpeg' && prepared.preview.startsWith('data:image/jpeg') && !/^data:image\/png/.test(prepared.preview))
  const preparedSize = await new Promise(resolve => { const image = new Image(); image.onload = () => resolve([image.naturalWidth, image.naturalHeight]); image.src = prepared.preview })
  check('crop keeps its own pixels and stays under 1600px', preparedSize[0] === 1000 && preparedSize[1] === 480)
  const turned = await rotateImage(source.toDataURL('image/png'))
  const turnedSize = await new Promise(resolve => { const image = new Image(); image.onload = () => resolve([image.naturalWidth, image.naturalHeight]); image.src = turned })
  check('a sideways photo can be turned upright', turnedSize[0] === 1200 && turnedSize[1] === 2000)
  const whole = await imageForExtraction(source.toDataURL('image/png'))
  const wholeSize = await new Promise(resolve => { const image = new Image(); image.onload = () => resolve([image.naturalWidth, image.naturalHeight]); image.src = whole.preview })
  check('full photo is resized down to 1600px', wholeSize[0] === 1600 && wholeSize[1] === 960)
  const online = await loadCatalog()
  check('catalog version is confirmed against Supabase', online.verified === true && online.release.rulesetVersion === online.rules.rulesetVersion)
  check('an unchanged catalog is not downloaded again', online.source !== 'supabase')
  const originalFetch = window.fetch
  window.fetch = async () => { throw Error('Simulated offline') }
  const offline = await loadCatalog()
  check('offline falls back to a validated copy', offline.verified === false && offline.release.rulesetVersion === online.release.rulesetVersion)
  localStorage.removeItem('wannaeat.catalog.v2')
  const freshOffline = await loadCatalog()
  check('first offline start uses bundle', freshOffline.source === 'bundle')
  window.fetch = originalFetch
  frame.src = '/'
  await wait(()=>textButton('설정하기') && !textButton('설정하기').disabled)
  check('green actual app home', doc().querySelector('.scan-card') && getComputedStyle(doc().querySelector('.primary')).backgroundColor === 'rgb(30, 99, 77)')
  textButton('설정하기').click(); await wait(()=>button('곡물 전체 피해요'))
  check('three-level catalog', doc().querySelectorAll('.catalog-group').length === 6 && doc().querySelectorAll('.criterion-row').length === 62)
  check('blocked subgroup has no select-all', !button('그 밖의 기름·지방 전체 피해요'))
  button('곡물 전체 피해요').click(); await render()
  button('밀 알려만줘요').click(); await render()
  check('child override visible', button('밀 알려만줘요').getAttribute('aria-pressed') === 'true')
  button('밀 선택 해제').click(); await render()
  check('child removal preserves siblings', doc().querySelectorAll('.criterion-row.chosen').length === 6)
  button('밀 피해요').click(); await render()
  const search = doc().querySelector('input[type=search]')
  setValue(search, '박력분'); search.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true})); await render()
  check('alias search narrows to wheat', doc().querySelectorAll('.criterion-row').length === 1 && !!button('밀 피해요'))
  textButton('기준 저장하기').click(); await wait(()=>doc().querySelector('.my-criteria'))
  const stored = JSON.parse(localStorage.getItem('wannaeat.criteria.v2'))
  check('new storage envelope', stored.rulesetVersion === online.release.rulesetVersion && stored.selections.length === 7 && stored.selections.every(r=>r.kind && r.id && ['avoid','inform'].includes(r.strength) && !('name' in r)))
  await new Promise(resolve => { frame.addEventListener('load', resolve, {once:true}); frame.contentWindow.location.reload() }); await wait(()=>textButton('수정') && !textButton('수정').disabled)
  check('saved criteria survive reload', doc().querySelector('.my-criteria').textContent.includes('피해요 7'))
  textButton('수정').click(); await wait(()=>button('곡물 전체 피해요'))
  button('밀 알려만줘요').click(); await render()
  textButton('변경 취소').click(); await wait(()=>doc().querySelector('.my-criteria'))
  check('cancel does not write draft', localStorage.getItem('wannaeat.criteria.v2') === JSON.stringify(stored))
  for (const width of [320,360,390]) {
    frame.style.width = width+'px'; await render()
    check(`home fits ${width}px`, doc().documentElement.scrollWidth <= width)
    textButton('수정').click(); await wait(()=>button('곡물 전체 피해요'))
    check(`criteria fits ${width}px`, doc().documentElement.scrollWidth <= width)
    textButton('변경 취소').click(); await wait(()=>doc().querySelector('.my-criteria'))
  }
  textButton('라벨 확인하기').click(); await wait(()=>doc().querySelector('.photo-frame'))
  check('photo upload explains processing', doc().querySelector('.photo-note').textContent.includes('분석 요청'))
  localStorage.setItem('wannaeat.criteria.v2', JSON.stringify({ rulesetVersion: online.release.rulesetVersion, selections:[{kind:'criterion',id:'wheat',strength:'avoid'},{kind:'criterion',id:'sugar',strength:'inform'}] }))
  frame.src = '/?check=result#review'; await wait(()=>doc().querySelector('#ingredient-text'))
  const ingredients = doc().querySelector('#ingredient-text')
  setValue(ingredients, '박력분, 무설탕, 복합조미식품'); ingredients.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true})); await render()
  textButton('내 기준과 비교하기').click(); await wait(()=>doc().querySelector('.verdict'))
  check('the verdict leads with what was found', doc().querySelector('.verdict').textContent.includes('피해요') && doc().querySelector('.result-block.hit').textContent.includes('밀'))
  check('unreadable evidence is always surfaced', doc().querySelector('.opaque-note').textContent.includes('복합조미식품'))
  check('criteria blocked by an opaque term are shown as chips, not full rows', doc().querySelector('.result-block.unknown .result-chips').textContent.includes('설탕'))
  check('the raw reading stays folded', [...doc().querySelectorAll('.result-fold summary')].some(item => item.textContent.includes('읽은 원재료')))
  textButton('확인한 기록 보기').click(); await wait(()=>doc().querySelector('.history-list'))
  check('result is kept on this device', doc().querySelectorAll('.history-row').length === 1 && doc().querySelector('.history-text').textContent.includes('박력분'))
  check('history stores no photo', !JSON.parse(localStorage.getItem('wannaeat.history.v1'))[0].image && JSON.parse(localStorage.getItem('wannaeat.history.v1'))[0].criteria.length === 2)
  await new Promise(resolve => { frame.addEventListener('load', resolve, {once:true}); frame.contentWindow.location.reload() }); await wait(()=>doc().querySelector('.history-list'))
  check('history survives a restart', doc().querySelectorAll('.history-row').length === 1)
  doc().querySelector('.history-head').click(); await wait(()=>doc().querySelector('.history-detail'))
  check('history detail shows the criteria of that moment', doc().querySelector('.history-detail').textContent.includes('밀') && doc().querySelector('.history-detail').textContent.includes('표기에 발견'))
  textButton('기록 모두 지우기').click(); await wait(()=>!doc().querySelector('.history-list'))
  check('clearing history removes the stored rows', localStorage.getItem('wannaeat.history.v1') === null)
  localStorage.setItem('wannaeat.criteria.v2', JSON.stringify({ rulesetVersion:'old', selections:[{kind:'criterion',id:'removed_id',strength:'avoid'}] }))
  frame.src = '/?check=review#criteria'; await wait(()=>textButton('변경된 기준 확인하고 저장'))
  check('unknown selection and version require review', doc().body.textContent.includes('removed_id'))
  textButton('변경된 기준 확인하고 저장').click(); await wait(()=>doc().querySelector('.my-criteria'))
  check('old preferences backed up before migration', JSON.parse(localStorage.getItem('wannaeat.criteria.v2.previous')).rulesetVersion === 'old')
  localStorage.setItem('wannaeat.criteria.v2','{broken')
  frame.src = '/?check=corrupt#criteria'; await wait(()=>doc().body.textContent.includes('이전에 저장한 기준을 읽을 수 없어요'))
  check('corrupt settings are not silently overwritten', localStorage.getItem('wannaeat.criteria.v2') === '{broken')
  report.textContent = 'PASS\n'+JSON.stringify(results,null,2)
} catch (error) { report.textContent = 'FAIL '+error.message+'\n'+JSON.stringify(results,null,2)+'\nURL: '+frame.contentWindow.location.href+'\nBODY: '+doc().body.innerText.slice(0,1600) }
</script></body></html>
