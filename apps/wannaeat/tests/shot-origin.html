<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>body{margin:0}iframe{width:390px;height:1500px;border:0;display:block}</style></head><body>
<iframe id="app"></iframe>
<script type="module">
// 원산지 모드 · 꽃 피는 결과 · 제품 이름이 붙은 기록을 휴대폰 폭으로 찍어 보는 준비 페이지. 서버는 부르지 않는다.
//   ?view=result | history | criteria
const view = new URLSearchParams(location.search).get('view') ?? 'result'
const frame = document.querySelector('#app')
const wait = async c => { for (let n = 0; n < 200; n++) { if (c()) return; await new Promise(r => setTimeout(r, 100)) } }
localStorage.clear()
const snapshot = await (await fetch('/src/catalog.snapshot.json')).json()
localStorage.setItem('wannaeat.criteria.v2', JSON.stringify({ rulesetVersion: snapshot.rulesetVersion, selections: [
  { kind: 'criterion', id: 'wheat', strength: 'avoid' }, { kind: 'origin', id: 'origin_cn', strength: 'avoid' },
  { kind: 'origin', id: 'origin_foreign', strength: 'inform' } ] }))
frame.src = '/?check=origin#review'
await wait(() => frame.contentDocument?.querySelector('#ingredient-text'))
const doc = frame.contentDocument, win = frame.contentWindow
const type = (element, value) => {
  const proto = element.tagName === 'TEXTAREA' ? win.HTMLTextAreaElement.prototype : win.HTMLInputElement.prototype
  Object.getOwnPropertyDescriptor(proto, 'value').set.call(element, value)
  element.dispatchEvent(new win.Event('input', { bubbles: true }))
}
const press = text => [...doc.querySelectorAll('button')].find(b => b.textContent.includes(text)).click()
const compare = async (name, text) => {
  type(doc.querySelector('#product-name'), name)
  type(doc.querySelector('#ingredient-text'), text)
  await new Promise(r => setTimeout(r, 150))
  press('내 기준과 비교하기')
  await wait(() => doc.querySelector('.verdict'))
}
if (view === 'criteria') {
  doc.querySelector('button[aria-label="홈으로 돌아가기"]').click(); await wait(() => doc.querySelector('.my-criteria'))
  press('수정'); await wait(() => doc.querySelector('.category-tabs'))
  ;[...doc.querySelectorAll('.category-tabs button')].find(b => b.textContent === '원산지').click()
} else {
  await compare('생선살 듬뿍 사각어묵', '연육90%[외국산(미국, 중국, 베트남 등)/어육살, 설탕], 전분가공품[타피오카전분(베트남산), 감자전분(폴란드산)], 정제소금(중국산), 밀가루(밀:미국산)')
  if (view !== 'result') { press('읽은 원재료 고치기'); await wait(() => doc.querySelector('#product-name')) }
  if (view !== 'result') await compare('홀 토마토 통조림', '토마토(60%), 토마토 쥬스(39.9%), 구연산(0.1%)\n원산지: 이탈리아')
  if (view === 'history') { press('확인한 기록 보기'); await wait(() => doc.querySelector('.history-list')) }
  if (view === 'happy') { /* 토마토 결과 그대로 */ }
}
await new Promise(r => setTimeout(r, 900))
document.title = 'ready'
</script></body></html>
